services:
  composeerr:
    image: ${COMPOSEERR_IMAGE:-ghcr.io/m0nte1ro/composeerr:latest}

    restart: always

    ports:
      - "${COMPOSEERR_PORT:-3000}:3000"

    volumes:
      - production_data:/app/data

    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"

    init: true
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health', {signal: AbortSignal.timeout(4000)}).then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  production_data:
    name: composeerr-production-data
