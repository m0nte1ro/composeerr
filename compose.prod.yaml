services:
  composeerr:
    build:
      context: .
      dockerfile: Dockerfile
      target: production

    image: composeerr:local

    restart: unless-stopped

    ports:
      - "3000:3000"

    volumes:
      - ./data:/app/data

    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"

    init: true

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
